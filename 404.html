<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>404 — SDN Sound Designer</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#D0191A;--red-hover:#a81315;--black:#0A0A0A;--off-black:#111111;--card:#161616;--border:#2a2a2a;--text:#E8E4DC;--muted:#7a7570}
html{font-size:16px}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.6;min-height:100vh;overflow-x:hidden;cursor:none;display:flex;flex-direction:column}
a,button{cursor:none}

/* curseur custom, identique au site */
#cursor{position:fixed;width:8px;height:8px;background:#fff;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s}
#cursor-ring{position:fixed;width:30px;height:30px;border:1px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .2s}
body.cursor-hover #cursor{width:5px;height:5px}
body.cursor-hover #cursor-ring{width:42px;height:42px;border-color:rgba(255,255,255,.6)}

nav{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 2.5rem;position:relative;z-index:3}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.12em;background:linear-gradient(135deg,#D0191A 0%,#8B0000 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.lang-switch{display:flex;align-items:center;border:.5px solid var(--border);overflow:hidden}
.lang-btn{background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;padding:.4rem .75rem;transition:all .2s;text-transform:uppercase}
.lang-btn.active{background:var(--red);color:#fff}
.lang-btn:not(.active):hover{color:var(--text)}

.err{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 2.5rem 6rem;position:relative;overflow:hidden}
.err-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:80px 80px;opacity:.18;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.3) 50%,transparent 100%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.3) 50%,transparent 100%);z-index:0}
.err-inner{position:relative;z-index:2;max-width:760px}
.err-tag{font-family:'DM Mono',monospace;font-size:.84rem;letter-spacing:.2em;color:var(--red);text-transform:uppercase;margin-bottom:2rem}
.err h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(6rem,14vw,12rem);line-height:.85;letter-spacing:.02em}

/* le signal : une ligne plate que parcourt un seul blip */
.scope{position:relative;height:96px;margin:1.5rem 0 2.5rem;max-width:560px;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);overflow:hidden}
.scope-line{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.scope-blip{position:absolute;top:0;bottom:0;width:120px;left:0;animation:sweep 4.5s linear infinite}
.scope-blip::before{content:'';position:absolute;top:50%;left:0;width:100%;height:1.5px;background:linear-gradient(90deg,transparent,var(--red) 45%,var(--red) 55%,transparent);transform:translateY(-50%)}
.scope-blip::after{content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;background:var(--red);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px var(--red)}
@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(calc(100% + 560px))}}

.err-sub{max-width:460px;color:var(--muted);font-size:1.14rem;line-height:1.8;margin-bottom:2.75rem}
.err-cta{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap}
.btn-primary{background:var(--red);color:#fff;padding:.9rem 2.25rem;font-size:.96rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:none;transition:background .2s}
.btn-primary:hover{background:var(--red-hover)}
.btn-ghost{color:var(--muted);font-size:.96rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:.5rem;transition:color .2s}
.btn-ghost:hover{color:var(--text)}
.btn-ghost::after{content:'→'}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:3px}

footer{border-top:.5px solid var(--border);background:var(--off-black);padding:1.5rem 2.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.15em;color:var(--muted)}
.footer-copy{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;color:var(--muted)}

@media(max-width:768px){
  nav{padding:1rem 1.5rem}
  .err{padding:0 1.5rem 4rem}
  .err-sub{font-size:1rem}
  .scope{height:72px}
  footer{padding:1.25rem 1.5rem}
}
@media(max-width:480px){
  .err-cta{flex-direction:column;align-items:flex-start;gap:1rem}
  .btn-primary{width:100%;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .scope-blip{animation:none;left:50%;transform:translateX(-50%)}
}
@media(hover:none),(pointer:coarse){
  body,a,button{cursor:auto}
  #cursor,#cursor-ring{display:none}
}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav>
  <a href="/" class="nav-logo">SDN</a>
  <div class="lang-switch">
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
  </div>
</nav>

<main class="err">
  <div class="err-grid"></div>
  <div class="err-inner">
    <div class="err-tag" data-fr="Erreur 404 · Page introuvable" data-en="Error 404 · Page not found" data-es="Error 404 · Página no encontrada">Error 404 · Page not found</div>
    <h1>404</h1>

    <div class="scope" role="img" aria-label="Ligne plate traversée par un signal, sans contenu">
      <div class="scope-line"></div>
      <div class="scope-blip"></div>
    </div>

    <p class="err-sub" data-fr="Silence sur cette piste. La page que vous cherchez a été déplacée, renommée, ou n'a jamais existé." data-en="Silence on this track. The page you're looking for has moved, been renamed, or never existed." data-es="Silencio en esta pista. La página que busca fue movida, renombrada, o nunca existió.">Silence on this track. The page you're looking for has moved, been renamed, or never existed.</p>

    <div class="err-cta">
      <a href="/" class="btn-primary" data-fr="Revenir à l'accueil" data-en="Back to home" data-es="Volver al inicio">Back to home</a>
      <a href="/#works" class="btn-ghost" data-fr="Voir mes projets" data-en="See my work" data-es="Ver mis trabajos">See my work</a>
      <a href="/#contact" class="btn-ghost" data-fr="Me contacter" data-en="Get in touch" data-es="Contactar">Get in touch</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">SDN</div>
  <div class="footer-copy">2026 © SDN · <span data-fr="Tous droits réservés" data-en="All rights reserved" data-es="Todos los derechos reservados">All rights reserved</span></div>
</footer>

<script>
function setLang(lang){
  document.documentElement.lang = lang;
  ['fr','en','es'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
  document.querySelectorAll('[data-fr]').forEach(el => {
    const v = el.getAttribute('data-'+lang) || el.getAttribute('data-en');
    if(v) el.textContent = v;
  });
}
setLang('en');

// curseur custom
const cur = document.getElementById('cursor'), ring = document.getElementById('cursor-ring');
document.addEventListener('mousemove', e => {
  cur.style.left = ring.style.left = e.clientX + 'px';
  cur.style.top  = ring.style.top  = e.clientY + 'px';
});
document.querySelectorAll('a,button').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
});
</script>

</body>
</html>
